<script>
(() => {
  const root = document.getElementById('remote-study');
  const remote = root.querySelector('.rs-remote');
  const buttons = new Map([...remote.querySelectorAll('[data-command]')].map(el => [el.dataset.command, el]));
  const flashTimers = new Map();
  function release(button) { if (button) button.classList.remove('is-down'); }
  function flash(button) { if (!button) return; clearTimeout(flashTimers.get(button)); button.classList.add('is-down'); flashTimers.set(button,setTimeout(() => { release(button); flashTimers.delete(button); },130)); }
  function action(command) {
    root.dispatchEvent(new CustomEvent('remote-command', { bubbles:true, detail:{ command, source:'remote' } }));
  }
  for (const [command, button] of buttons) {
    button.addEventListener('pointerdown', event => { if (event.button !== 0) return; clearTimeout(flashTimers.get(button)); button.classList.add('is-down'); });
    for (const name of ['pointerup','pointercancel','pointerleave','lostpointercapture']) button.addEventListener(name, () => release(button));
    button.addEventListener('click', () => { flash(button); action(command); });
    button.addEventListener('keydown', event => { if (event.key === ' ' || event.key === 'Enter') { if (event.repeat && !['up','down','left','right','volume-up','volume-down','zoom-in','zoom-out','back'].includes(command)) { event.preventDefault(); return; } button.classList.add('is-down'); } });
    button.addEventListener('keyup', () => release(button));
    button.addEventListener('blur', () => release(button));
  }
  // Rows and columns match the physical layout. Vertical movement keeps the
  // nearest available column, horizontal movement stays within the current row.
  const rows = [
    [['power',0],['top-right',2]],
    [['volume-up',0],['zoom-in',2]],
    [['volume-down',0],['zoom-out',2]],
    [['up',1]],
    [['left',0],['ok',1],['right',2]],
    [['down',1]],
    [['home',0],['return',1],['menu',2]],
    [['selfview',0],['mcu-layout',1],['screen-layout',2]],
    [['pc',0],['program',1],['video-input',2]],
    [['call',0],['back',1],['hangup',2]],
    [['digit-1',0],['digit-2',1],['digit-3',2]],
    [['digit-4',0],['digit-5',1],['digit-6',2]],
    [['digit-7',0],['digit-8',1],['digit-9',2]],
    [['digit-*',0],['digit-0',1],['digit-#',2]],
    [['mute',1]],
  ];
  function moveFocus(command, key) {
    const rowIndex = rows.findIndex(row => row.some(([name]) => name === command));
    if (rowIndex < 0) return;
    const row = rows[rowIndex];
    const current = row.findIndex(([name]) => name === command);
    let target;
    if (key === 'ArrowLeft' || key === 'ArrowRight') {
      const index = current + (key === 'ArrowLeft' ? -1 : 1);
      target = row[index]?.[0];
    } else {
      const next = rows[rowIndex + (key === 'ArrowUp' ? -1 : 1)];
      if (next) target = next.reduce((best, item) => Math.abs(item[1] - row[current][1]) < Math.abs(best[1] - row[current][1]) ? item : best)[0];
    }
    if (target) buttons.get(target).focus();
  }
  const shortcuts = { Escape:'return', Backspace:'back', m:'mute', M:'mute', '+':'volume-up', '-':'volume-down' };
  root.addEventListener('keydown', event => {
    if (event.ctrlKey || event.metaKey || event.altKey || event.target.closest('input,textarea,select,[contenteditable=true]')) return;
    const active = event.target.closest('[data-command]');
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(event.key)) {
      event.preventDefault();
      moveFocus(active?.dataset.command || 'power', event.key);
      return;
    }
    if ((event.key === 'Enter' || event.key === ' ') && active) return;
    const command = /^[0-9*#]$/.test(event.key) ? `digit-${event.key}` : shortcuts[event.key];
    if (!command) return;
    event.preventDefault();
    if (event.repeat && !['volume-up','volume-down','back'].includes(command)) return;
    flash(buttons.get(command)); action(command);
  });
  const initial = buttons.get('power');
  initial.classList.add('keyboard-start');
  initial.addEventListener('blur', () => initial.classList.remove('keyboard-start'));
  window.addEventListener('pointerdown', () => initial.classList.remove('keyboard-start'), { once:true });
  initial.focus({preventScroll:true});
  window.addEventListener('blur', () => { for (const button of buttons.values()) release(button); });
})();
</script>
